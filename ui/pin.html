<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>Tasks — Today</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* @@THEMES_CSS@@ */
  body {
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 12px; height: 100vh;
    display: flex; flex-direction: column; overflow: hidden;
  }

  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 10px; background: var(--surface);
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .header-title { font-size: 10px; letter-spacing: 0.08em; color: var(--muted); text-transform: uppercase; }
  .clock { font-family: "SF Mono","Menlo",monospace; font-size: 12px; color: var(--accent); letter-spacing: 0.04em; }

  .count-bar {
    padding: 4px 10px; background: var(--surface);
    border-bottom: 1px solid var(--border); font-size: 10px;
    color: var(--muted); display: flex; justify-content: space-between; flex-shrink: 0;
  }
  .refresh-btn {
    background: none; border: none; color: var(--muted);
    font-size: 11px; cursor: pointer; opacity: 0.5; transition: opacity 0.1s;
  }
  .refresh-btn:hover { opacity: 1; }

  .task-list { flex: 1; overflow-y: auto; padding: 4px 6px; }
  .task-list::-webkit-scrollbar { width: 3px; }
  .task-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .task-row {
    position: relative;
    display: flex; align-items: center; gap: 5px;
    padding: 4px 5px 4px 9px; border-radius: 3px; margin-bottom: 1px; user-select: none;
  }
  .task-row:hover { background: var(--btn-hover); }
  .task-row.done-row { opacity: 0.45; }

  .task-check {
    width: 13px; height: 13px; border: 1.5px solid var(--border); border-radius: 3px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; cursor: pointer; transition: background 0.12s, border-color 0.12s;
  }
  .task-check:hover   { border-color: var(--low); }
  .task-check.checked { background: var(--low); border-color: var(--low); }
  .task-check.checked::after { content: "✓"; font-size: 8px; color: #fff; font-weight: 700; }

  /* ── Priority accent — a pulsing bar at the left boundary of the row; tempo scales with urgency ── */
  .task-row::before {
    content: ''; position: absolute; left: 2px; top: 4px; bottom: 4px; width: 3px;
    border-radius: 2px; background: var(--muted); opacity: 0.3;
  }
  .task-row.p1::before {
    background: var(--high); color: var(--high); opacity: 0.9;
    animation: pri-pulse 1.4s ease-in-out infinite;
  }
  .task-row.p2::before {
    background: var(--med); color: var(--med); opacity: 0.8;
    animation: pri-pulse 2.6s ease-in-out infinite;
  }
  .task-row.p3::before {
    background: var(--low); color: var(--low); opacity: 0.7;
    animation: pri-pulse 4s ease-in-out infinite;
  }
  .task-row.done-row::before { background: var(--muted); opacity: 0.3; animation: none; }
  @keyframes pri-pulse {
    0%, 100% { box-shadow: 0 0 0 0 currentColor; }
    50%      { box-shadow: 0 0 5px 1px currentColor; }
  }
  /* Reordered marker — lights up when this task's position was manually dragged out of priority order */
  .task-row.reordered-row::after {
    content: ''; position: absolute; top: 2px; right: 3px;
    width: 5px; height: 5px; border-radius: 50%;
    background: #ff3b3b; box-shadow: 0 0 3px #ff3b3b;
  }

  .task-name { flex: 1; font-size: 11.5px; line-height: 1.3; word-break: break-word; }
  .task-row.done-row .task-name { text-decoration: line-through; }
  .task-edit-input {
    width: 100%; background: var(--input-bg); border: 1px solid var(--accent);
    border-radius: 3px; color: var(--text); font: inherit; padding: 1px 5px; outline: none;
  }

  .cat-pod {
    display: inline-flex; align-items: center;
    font-size: 8.5px; font-weight: 600; padding: 1px 5px;
    border-radius: 10px; flex-shrink: 0; color: #fff;
    white-space: nowrap; max-width: 60px; overflow: hidden; text-overflow: ellipsis;
  }

  .repeat-ind { color: var(--accent); font-size: 10px; flex-shrink: 0; opacity: 0.8; }

  .empty-state { color: var(--muted); font-size: 11px; padding: 20px 8px; text-align: center; }
</style>
</head>
<body>

<div class="header theme-bar">
  <span class="header-title">Today's Tasks</span>
  <span class="clock" id="clock"></span>
</div>
<div class="count-bar theme-bar">
  <span id="count-label"></span>
  <button class="refresh-btn" id="refresh-btn" title="Refresh">&#8635;</button>
</div>
<div class="task-list" id="task-list"></div>

<script>
function api() {
  if (!window.pywebview || !window.pywebview.api) throw new Error('not ready');
  return window.pywebview.api;
}

function startClock() {
  function tick() {
    const n = new Date(), p = v => String(v).padStart(2,'0');
    document.getElementById('clock').textContent =
      `${p(n.getHours())}:${p(n.getMinutes())}:${p(n.getSeconds())}`;
  }
  tick(); setInterval(tick, 1000);
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function mdFormat(s) {
  let out = esc(s);
  out = out.replace(/~~([^~]+)~~/g, '<del>$1</del>');
  out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  out = out.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  return out;
}
const PRI_ROW_CLS = {1:'p1', 2:'p2', 3:'p3'};

function catPod(name, color) {
  if (!name) return '';
  return `<span class="cat-pod" style="background:${esc(color)}" title="${esc(name)}">${esc(name.slice(0,8))}</span>`;
}

async function loadTasks() {
  try {
    const tasks = await api().get_today_tasks();
    const done  = tasks.filter(t => t.completed).length;
    document.getElementById('count-label').textContent =
      tasks.length ? `${done} / ${tasks.length} done` : '';
    const list = document.getElementById('task-list');
    if (!tasks.length) { list.innerHTML = '<div class="empty-state">No tasks today.</div>'; return; }
    list.innerHTML = tasks.map(t => {
      const priCls    = PRI_ROW_CLS[t.priority] || 'p2';
      const reordered = t.reordered ? ' reordered-row' : '';
      const title     = t.reordered ? 'Manually reordered' : '';
      return `<div class="task-row ${priCls} ${t.completed ? 'done-row':''}${reordered}" title="${title}">
        <div class="task-check ${t.completed ? 'checked':''}" onclick="toggle(${t.id},${t.completed})"></div>
        ${t.repeatable ? '<span class="repeat-ind" title="Repeating task">&#8635;</span>' : ''}
        <span class="task-name" data-name="${esc(t.name)}" ondblclick="startEditTask(event,${t.id})">${mdFormat(t.name)}</span>
        ${t.cat_name ? catPod(t.cat_name, t.cat_color) : ''}
      </div>`;
    }).join('');
  } catch(e) {}
}

async function toggle(id, wasDone) {
  try {
    if (wasDone) await api().unmark_done(id); else await api().mark_done(id);
    await loadTasks();
  } catch(e) {}
}

// ── Inline task-name editing (double-click) ──
function startEditTask(e, id) {
  const span = e.currentTarget;
  if (span.querySelector('input')) return;
  const rawName = span.dataset.name;
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'task-edit-input';
  input.maxLength = 280;
  input.value = rawName;
  span.textContent = '';
  span.appendChild(input);
  input.focus();
  input.select();

  let settled = false;
  async function commit() {
    if (settled) return;
    settled = true;
    const val = input.value.trim();
    if (val && val !== rawName) {
      try { await api().update_task_name(id, val); } catch(err) {}
    }
    await loadTasks();
  }
  input.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter') { ev.preventDefault(); commit(); }
    else if (ev.key === 'Escape') { settled = true; loadTasks(); }
  });
  input.addEventListener('blur', commit);
  input.addEventListener('click', (ev) => ev.stopPropagation());
}

document.getElementById('refresh-btn').addEventListener('click', loadTasks);
setInterval(loadTasks, 60000);

// ── Zoom (Cmd+= / Cmd+- / Cmd+0) ──
const BASE_TITLE = 'Tasks — Today';
const ZOOM_MIN = 0.7, ZOOM_MAX = 1.8, ZOOM_STEP = 0.1;
let zoomLevel = 1;
let zoomTitleTimer = null;

function applyZoom() {
  document.body.style.zoom = zoomLevel;
  document.title = `${BASE_TITLE} (${Math.round(zoomLevel * 100)}%)`;
  clearTimeout(zoomTitleTimer);
  zoomTitleTimer = setTimeout(() => { document.title = BASE_TITLE; }, 1200);
}

document.addEventListener('keydown', (e) => {
  if (!e.metaKey) return;
  if (e.key === '=' || e.key === '+') {
    e.preventDefault();
    zoomLevel = Math.min(ZOOM_MAX, +(zoomLevel + ZOOM_STEP).toFixed(2));
    applyZoom();
  } else if (e.key === '-') {
    e.preventDefault();
    zoomLevel = Math.max(ZOOM_MIN, +(zoomLevel - ZOOM_STEP).toFixed(2));
    applyZoom();
  } else if (e.key === '0') {
    e.preventDefault();
    zoomLevel = 1;
    applyZoom();
  }
});

async function init() {
  startClock();
  try {
    const cfg = await api().get_config();
    document.documentElement.setAttribute('data-theme', cfg.theme || 'dark');
  } catch(e) {}
  await loadTasks();
}

if (window.pywebview && window.pywebview.api) {
  init();
} else {
  window.addEventListener('pywebviewready', init);
}
</script>
</body>
</html>
