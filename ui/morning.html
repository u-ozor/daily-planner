<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>Morning Planner</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* @@THEMES_CSS@@ */
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 13px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Header ── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }
  .header-label { font-size: 10px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
  .header-date  { font-size: 13px; color: var(--text); font-weight: 500; margin-top: 1px; }
  .clock {
    font-family: "SF Mono", "Menlo", monospace;
    font-size: 16px;
    color: var(--accent);
    letter-spacing: 0.05em;
  }

  /* ── Week grid ── */
  .week-section {
    flex-shrink: 0;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    padding-bottom: 8px;
  }
  .section-label {
    padding: 6px 16px 4px;
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--muted);
    text-transform: uppercase;
  }
  .week-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 0;
    padding: 0 10px;
    min-width: 0;
  }
  .day-col {
    border: 1px solid var(--border);
    border-radius: 4px;
    margin: 0 2px;
    padding: 5px 4px;
    height: 96px;
    overflow: hidden;
    min-width: 0;
  }
  .day-col.today {
    background: var(--today-col);
    border-color: var(--today-bdr);
  }
  .day-head { text-align: center; margin-bottom: 5px; }
  .day-name {
    display: block;
    font-size: 9px;
    letter-spacing: 0.08em;
    color: var(--muted);
    text-transform: uppercase;
  }
  .day-num {
    display: block;
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.15;
  }
  .day-col.today .day-name { color: var(--accent); }
  .day-col.today .day-num  { color: var(--accent); }

  /* Silver/Gold — the "today" cell flips which metal is background vs text as
     it animates, instead of sitting as one flat gold-on-gold combo. Doesn't
     touch the theme's base palette (still --today-col/--today-bdr/--accent
     everywhere else) — this is a one-off flourish on the single most-glanced-at
     cell in the week grid. */
  html[data-theme="silvergold"] .day-col.today {
    animation: sg-today-bg 12s ease-in-out infinite;
  }
  html[data-theme="silvergold"] .day-col.today .day-name,
  html[data-theme="silvergold"] .day-col.today .day-num {
    animation: sg-today-text 12s ease-in-out infinite;
  }
  @keyframes sg-today-bg {
    0%, 100% { background-color: #f2c869; border-color: #8a5a0a; }
    50%      { background-color: #c7ccd1; border-color: #4a4f57; }
  }
  @keyframes sg-today-text {
    0%, 100% { color: #4a4f57; }
    50%      { color: #8a5a0a; }
  }
  .day-tasks { display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
  .day-dot   { display: flex; align-items: center; gap: 3px; overflow: hidden; }
  .dot-mark  { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
  .dot-mark.h    { background: var(--high); }
  .dot-mark.m    { background: var(--med); }
  .dot-mark.l    { background: var(--low); }
  .dot-mark.done { background: var(--done-text); }
  .dot-name      { font-size: 9px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot-name.done { text-decoration: line-through; }
  .day-more      { font-size: 8.5px; color: var(--muted); opacity: 0.8; margin-top: 1px; cursor: default; }
  .day-more:hover { color: var(--accent); opacity: 1; }

  #week-more-portal {
    display: none; position: fixed;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 8px; max-width: 200px;
    max-height: 160px; overflow-y: auto;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3); z-index: 1000;
  }
  #week-more-portal.open { display: block; }
  #week-more-portal .day-dot { padding: 2px 0; }
  #week-more-portal .dot-name { font-size: 10px; white-space: normal; }

  /* ── Main split ── */
  .main { display: flex; flex: 1; overflow: hidden; }
  .panel { display: flex; flex-direction: column; overflow: hidden; }
  .panel-today  { flex: 1.1; border-right: 1px solid var(--border); }
  .panel-weekly { flex: 0.9; }

  .panel-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 14px 5px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .panel-title { font-size: 10px; letter-spacing: 0.1em; color: var(--muted); text-transform: uppercase; }
  .panel-count { font-size: 10px; color: var(--muted); }
  .panel-body  { flex: 1; overflow-y: auto; padding: 5px 7px; }
  .panel-body::-webkit-scrollbar { width: 3px; }
  .panel-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* ── Task rows ── */
  .task-row {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 5px; border-radius: 4px; margin-bottom: 2px;
    user-select: none; transition: background 0.1s;
  }
  .task-row:hover { background: var(--btn-hover); }
  .task-row.done-row { opacity: 0.5; }

  .task-check {
    width: 15px; height: 15px;
    border: 1.5px solid var(--border);
    border-radius: 3px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; cursor: pointer;
    transition: background 0.12s, border-color 0.12s;
  }
  .task-check:hover { border-color: var(--accent); }
  .task-check.checked { background: var(--accent); border-color: var(--accent); }
  .task-check.checked::after { content: "✓"; font-size: 9px; color: #fff; font-weight: 700; }

  /* ── Priority badge — click to open a picker, same pattern as category ── */
  .pri-badge {
    font-size: 9px; font-weight: 700;
    padding: 1px 4px; border-radius: 3px; flex-shrink: 0;
    letter-spacing: 0.04em; cursor: pointer; transition: filter 0.1s;
  }
  .pri-badge:hover { filter: brightness(1.2); }
  .pri-1 { background: rgba(176,48,48,0.15);  color: var(--high); }
  .pri-2 { background: rgba(154,110,16,0.15); color: var(--med); }
  .pri-3 { background: rgba(58,112,64,0.15);  color: var(--low); }

  /* ── Reordered indicator — lights up when a task's position was manually dragged out of priority order ── */
  .moved-dot {
    width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0;
    background: transparent;
  }
  .moved-dot.show { background: #ff3b3b; box-shadow: 0 0 3px #ff3b3b; }

  /* ── Drag handle — press and drag a whole row to persist a custom queue order.
     Fixed neutral color + a dark+light dual halo (not var(--muted)/var(--accent))
     so the grip stays visible no matter the theme or what's flowing behind it. ── */
  .drag-handle {
    flex-shrink: 0; cursor: grab; color: #9a9aa2;
    font-size: 11px; line-height: 1; opacity: 0.55; padding: 0 2px;
    text-shadow: 0 0 2px rgba(0,0,0,0.65), 0 0 3px rgba(255,255,255,0.5);
    transition: opacity 0.1s, color 0.1s;
  }
  .drag-handle:hover  { opacity: 1; color: #eaeaee; }
  .drag-handle:active { cursor: grabbing; }
  .task-row.drag-ghost { opacity: 0.35; }

  .task-name { flex: 1; font-size: 12.5px; line-height: 1.3; word-break: break-word; }
  .task-row.done-row .task-name { text-decoration: line-through; }
  .task-edit-input {
    width: 100%; background: var(--input-bg); border: 1px solid var(--accent);
    border-radius: 3px; color: var(--text); font: inherit; padding: 1px 5px; outline: none;
  }

  .task-btn {
    background: none; border: none; cursor: pointer;
    color: var(--muted); font-size: 12px; padding: 2px 4px;
    border-radius: 3px; flex-shrink: 0; opacity: 0.4;
    transition: opacity 0.1s, color 0.1s;
  }
  .task-btn:hover { opacity: 1; }
  .task-btn.promote:hover { color: var(--accent); }
  .task-btn.demote:hover  { color: var(--med); }
  .task-btn.delete:hover  { color: var(--warn); }
  .task-btn.cat-change:hover { color: var(--accent); }

  /* Inline category/priority pickers — portals at body level to escape overflow-y:auto clipping */
  .task-cat-wrap { flex-shrink: 0; }
  #task-cat-portal, #task-pri-portal {
    display: none; position: fixed;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px; min-width: 160px;
    max-height: 200px; overflow-y: auto;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3); z-index: 1000;
  }
  #task-cat-portal.open, #task-pri-portal.open { display: block; }
  #task-cat-portal::-webkit-scrollbar, #task-pri-portal::-webkit-scrollbar { width: 3px; }
  #task-cat-portal::-webkit-scrollbar-thumb, #task-pri-portal::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .task-cat-option {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 6px; border-radius: 3px; cursor: pointer; font-size: 11px;
    transition: background 0.1s;
  }
  .task-cat-option:hover { background: var(--btn-hover); }

  /* New-task picker list scrollable from 3 onward */
  #cat-list { max-height: 90px; overflow-y: auto; }
  #cat-list::-webkit-scrollbar { width: 3px; }
  #cat-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .empty-state { color: var(--muted); font-size: 11.5px; padding: 18px 8px; text-align: center; }

  .weekly-warn {
    margin: 4px 8px 2px; padding: 5px 8px;
    background: rgba(192,48,48,0.1);
    border: 1px solid rgba(192,48,48,0.3);
    border-radius: 4px; color: var(--warn);
    font-size: 11px; font-weight: 600; text-align: center; display: none;
  }

  /* ── Category pods ── */
  .cat-pod {
    display: inline-flex; align-items: center;
    font-size: 9.5px; font-weight: 600; padding: 1px 6px;
    border-radius: 10px; flex-shrink: 0; letter-spacing: 0.03em;
    color: #fff; white-space: nowrap; max-width: 80px;
    overflow: hidden; text-overflow: ellipsis;
  }

  /* ── Category picker ── */
  .cat-picker-wrap { position: relative; flex-shrink: 0; }
  .cat-tag-btn {
    background: none; border: 1px solid var(--border);
    border-radius: 10px; color: var(--muted); font-size: 10px;
    padding: 2px 8px; cursor: pointer; transition: all 0.1s;
    white-space: nowrap;
  }
  .cat-tag-btn:hover { border-color: var(--accent); color: var(--text); }
  .cat-tag-btn.has-cat { color: #fff; border-color: transparent; }

  .cat-picker {
    display: none; position: absolute; bottom: calc(100% + 6px); left: 0;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 7px; padding: 8px; width: 220px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25); z-index: 100;
  }
  .cat-picker.open { display: block; }
  .cat-picker-title { font-size: 9px; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 6px; }
  .cat-option {
    display: flex; align-items: center; gap: 7px;
    padding: 4px 6px; border-radius: 4px; cursor: pointer; font-size: 11.5px;
    transition: background 0.1s;
  }
  .cat-option:hover { background: var(--btn-hover); }
  .cat-option.selected { background: var(--btn-hover); font-weight: 600; }
  .cat-swatch { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .cat-option-name { flex: 1; }
  .cat-swatch-btn {
    position: relative; width: 10px; height: 10px; flex-shrink: 0;
    display: inline-block; cursor: pointer;
  }
  .cat-swatch-btn input[type="color"] {
    position: absolute; top: -4px; left: -4px; width: 18px; height: 18px;
    opacity: 0; cursor: pointer; border: none; padding: 0;
  }

  .cat-divider { border: none; border-top: 1px solid var(--border); margin: 6px 0; }

  .cat-new-row { display: flex; gap: 5px; align-items: center; margin-bottom: 5px; }
  .cat-name-input {
    flex: 1; background: var(--input-bg); border: 1px solid var(--border);
    border-radius: 4px; color: var(--text); font-size: 11px;
    padding: 3px 7px; outline: none;
  }
  .cat-name-input:focus { border-color: var(--accent); }
  .cat-name-input::placeholder { color: var(--muted); }
  .cat-add-btn {
    background: var(--accent); border: none; border-radius: 4px;
    color: #fff; font-size: 10px; padding: 3px 8px; cursor: pointer; flex-shrink: 0;
  }

  .cat-colors { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 2px; }
  .cat-color-swatch {
    width: 16px; height: 16px; border-radius: 50%; cursor: pointer;
    border: 2px solid transparent; transition: border-color 0.1s, transform 0.1s;
    flex-shrink: 0;
  }
  .cat-color-swatch:hover   { transform: scale(1.2); }
  .cat-color-swatch.picked  { border-color: var(--text); }
  .cat-color-custom {
    width: 16px; height: 16px; border-radius: 50%; cursor: pointer;
    border: 1px dashed var(--muted); background: var(--input-bg);
    overflow: hidden; flex-shrink: 0;
  }
  .cat-color-custom input[type="color"] {
    width: 200%; height: 200%; margin: -50%; border: none;
    background: none; cursor: pointer; opacity: 0;
  }

  /* ── Input ── */
  .input-section {
    flex-shrink: 0;
    border-top: 1px solid var(--border);
    background: var(--surface);
    padding: 8px 12px 6px;
  }
  .input-row { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
  .input-prompt { font-family: "SF Mono", "Menlo", monospace; font-size: 12px; color: var(--accent); flex-shrink: 0; }
  .task-input {
    flex: 1;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 5px; color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 12.5px; padding: 5px 10px; outline: none;
    transition: border-color 0.15s;
  }
  .task-input:focus { border-color: var(--accent); }
  .task-input::placeholder { color: var(--muted); }

  .scope-badge {
    font-size: 10px; font-weight: 600; padding: 2px 7px;
    border-radius: 3px; flex-shrink: 0; letter-spacing: 0.05em;
    border: 1px solid var(--border); color: var(--muted);
    background: var(--input-bg);
  }
  .scope-badge.today-mode  { border-color: var(--accent); color: var(--accent); background: var(--today-col); }
  .scope-badge.weekly-mode { border-color: var(--med);    color: var(--med); }

  .input-hint { font-size: 10px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
  .hint-code {
    font-family: "SF Mono", "Menlo", monospace;
    background: var(--input-bg); border: 1px solid var(--border);
    border-radius: 3px; padding: 0 4px; color: var(--accent);
    font-size: 10px;
  }
  .send-btn {
    background: var(--accent); border: none; border-radius: 5px;
    color: #fff; font-size: 12px; font-weight: 500;
    padding: 5px 14px; cursor: pointer; flex-shrink: 0;
    transition: opacity 0.1s;
  }
  .send-btn:hover { opacity: 0.85; }
  .feedback { font-size: 11px; padding: 2px 6px; border-radius: 3px; opacity: 0; transition: opacity 0.25s; flex-shrink: 0; }
  .feedback.show { opacity: 1; }
  .feedback.ok  { color: var(--low); }
  .feedback.err { color: var(--warn); }

  /* ── Footer ── */
  .footer {
    flex-shrink: 0; border-top: 1px solid var(--border);
    background: var(--surface); padding: 5px 12px;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .footer-cmd {
    font-family: "SF Mono", "Menlo", monospace; font-size: 10px;
    color: var(--muted); background: var(--input-bg);
    border: 1px solid var(--border); border-radius: 3px; padding: 2px 7px;
  }
  .footer-btn {
    background: none; border: 1px solid var(--border);
    border-radius: 4px; color: var(--muted); font-size: 11px;
    padding: 3px 10px; cursor: pointer;
    transition: border-color 0.1s, color 0.1s;
  }
  .footer-btn:hover { border-color: var(--accent); color: var(--text); }

  .theme-group { display: flex; gap: 4px; margin-left: auto; }
  .theme-btn {
    background: none; border: 1px solid var(--border);
    border-radius: 4px; color: var(--muted); font-size: 10px;
    padding: 2px 8px; cursor: pointer; transition: all 0.1s;
  }
  .theme-btn:hover   { border-color: var(--accent); color: var(--text); }
  .theme-btn.active  { border-color: var(--accent); color: var(--accent); font-weight: 600; }

  /* ── Theme "More" submenu — holds every theme past the 5 most recently used ── */
  .theme-more-wrap { position: relative; }
  .theme-more-menu {
    display: none; position: absolute; bottom: calc(100% + 6px); right: 0;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px; min-width: 120px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25); z-index: 100;
  }
  .theme-more-menu.open { display: block; }
  .theme-more-option {
    padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px;
    color: var(--muted); transition: background 0.1s, color 0.1s;
  }
  .theme-more-option:hover { background: var(--btn-hover); color: var(--text); }
  .theme-more-option.active { color: var(--accent); font-weight: 600; }

  /* ── Settings panel ── */
  .settings-panel {
    display: none; background: var(--surface);
    border-top: 1px solid var(--border); padding: 8px 14px;
    align-items: center; gap: 12px; flex-wrap: wrap; flex-shrink: 0;
  }
  .settings-panel.open { display: flex; }
  .settings-label { font-size: 11px; color: var(--muted); }
  .settings-input {
    background: var(--input-bg); border: 1px solid var(--border);
    border-radius: 4px; color: var(--text);
    font-family: "SF Mono", "Menlo", monospace;
    font-size: 12px; padding: 3px 8px; width: 68px; outline: none;
  }
  .settings-input:focus { border-color: var(--accent); }
  .settings-save {
    background: var(--accent); border: none; border-radius: 4px;
    color: #fff; font-size: 11px; padding: 4px 12px; cursor: pointer;
  }
  .settings-ok  { font-size: 10px; color: var(--low); }
  .settings-err { font-size: 10px; color: var(--warn); }
</style>
</head>
<body>

<!-- Portal for task category picker — lives at body level to escape overflow clipping -->
<div id="task-cat-portal"></div>
<!-- Portal for task priority picker — same reason -->
<div id="task-pri-portal"></div>
<!-- Portal for "+N more" week-grid hover popover — same reason -->
<div id="week-more-portal"></div>

<div class="header theme-bar">
  <div>
    <div class="header-label">Morning Planner</div>
    <div class="header-date" id="header-date"></div>
  </div>
  <div class="clock" id="clock"></div>
</div>

<div class="week-section theme-bar">
  <div class="section-label">Week at a Glance</div>
  <div class="week-grid" id="week-grid"></div>
</div>

<div class="main">
  <div class="panel panel-today">
    <div class="panel-header">
      <span class="panel-title">Today</span>
      <span class="panel-count" id="today-count"></span>
    </div>
    <div class="panel-body" id="today-list"></div>
  </div>

  <div class="panel panel-weekly">
    <div class="panel-header">
      <span class="panel-title">Weekly Backlog</span>
      <span class="panel-count" id="weekly-count"></span>
    </div>
    <div class="weekly-warn" id="weekly-warn">&#9888; Clean out your weeklies</div>
    <div class="panel-body" id="weekly-list"></div>
  </div>
</div>

<div class="input-section theme-bar">
  <div class="input-row">
    <span class="input-prompt">&gt;</span>
    <input class="task-input" id="task-input" type="text"
      placeholder="buy milk, h   ·   w call doctor   ·   fix report, l"
      autocomplete="off" spellcheck="false">
    <span class="scope-badge today-mode" id="scope-badge">TODAY</span>
    <div class="cat-picker-wrap" id="cat-picker-wrap">
      <button class="cat-tag-btn" id="cat-tag-btn" type="button">&#127991; Category</button>
      <div class="cat-picker" id="cat-picker">
        <div class="cat-picker-title">Assign Category</div>
        <div class="cat-option" id="cat-none-opt" onclick="selectCategory(null,null,null)">
          <span class="cat-swatch" style="background:var(--border)"></span>
          <span>None</span>
        </div>
        <div id="cat-list"></div>
        <hr class="cat-divider">
        <div class="cat-colors" id="cat-color-swatches"></div>
        <div class="cat-new-row">
          <input class="cat-name-input" id="cat-name-input" placeholder="New category…" maxlength="30">
          <button class="cat-add-btn" type="button" onclick="createCategory()">Add</button>
        </div>
      </div>
    </div>
    <button class="send-btn" id="send-btn">Add</button>
    <span class="feedback" id="feedback"></span>
  </div>
  <div class="input-hint">
    <span>Just type a task and press Enter — goes to <b>today</b> by default.</span>
    <span>Prefix with <span class="hint-code">w </span> to send to <b>weekly backlog</b>.</span>
    <span>Add <span class="hint-code">, h</span> <span class="hint-code">, m</span> <span class="hint-code">, l</span> for priority.</span>
  </div>
</div>

<div class="settings-panel theme-bar" id="settings-panel">
  <span class="settings-label">Morning</span>
  <input class="settings-input" id="morning-time" type="text" placeholder="07:30" maxlength="5">
  <span class="settings-label">Evening</span>
  <input class="settings-input" id="evening-time" type="text" placeholder="21:00" maxlength="5">
  <button class="settings-save" id="settings-save">Apply</button>
  <span class="settings-ok"  id="settings-ok"></span>
  <span class="settings-err" id="settings-err"></span>
</div>

<div class="footer theme-bar">
  <span class="footer-cmd">planner morning</span>
  <button class="footer-btn" id="btn-settings">&#9881; Settings</button>
  <button class="footer-btn" id="btn-pin">&#128204; Pin Task List</button>
  <button class="footer-btn" id="btn-evening">&#127769; Evening Review</button>
  <div class="theme-group" id="theme-group"></div>
</div>

<script>
// ── API guard ──
function api() {
  if (!window.pywebview || !window.pywebview.api)
    throw new Error('API not ready');
  return window.pywebview.api;
}

// ── Clock ──
function startClock() {
  function tick() {
    const n = new Date();
    const p = v => String(v).padStart(2, '0');
    document.getElementById('clock').textContent =
      `${p(n.getHours())}:${p(n.getMinutes())}:${p(n.getSeconds())}`;
  }
  tick(); setInterval(tick, 1000);
}

function setDate() {
  document.getElementById('header-date').textContent =
    new Date().toLocaleDateString('en-US', { weekday:'long', month:'short', day:'numeric' });
}

// ── Theme picker (applyTheme, renderThemeMenu, selectTheme) — shared, see ui/theme-menu.js ──
// @@THEME_MENU_JS@@

// ── Helpers ──
const PRI_LABEL = {1:'H', 2:'M', 3:'L'};
const PRI_CLASS = {1:'pri-1', 2:'pri-2', 3:'pri-3'};
const DOT_CLS   = {1:'h', 2:'m', 3:'l'};

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Obsidian-style inline formatting — escapes first, then applies markup
// to already-escaped text, so there is no way to inject real tags.
function mdFormat(s) {
  let out = esc(s);
  out = out.replace(/~~([^~]+)~~/g, '<del>$1</del>');
  out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  out = out.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  return out;
}

function showFeedback(msg, ok = true) {
  const el = document.getElementById('feedback');
  el.textContent = msg;
  el.className = 'feedback show ' + (ok ? 'ok' : 'err');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2500);
}

// ── Category state ──
const PRESET_COLORS = ['#6aaef0','#74cc7c','#e8bc50','#f07878','#b07aec','#f0a040','#f07ab4','#50c8c0'];
let selectedCatId    = null;
let selectedCatColor = null;
let selectedCatName  = null;
let newCatColor      = PRESET_COLORS[0];

function catPod(name, color) {
  if (!name) return '';
  return `<span class="cat-pod" style="background:${esc(color)}" title="${esc(name)}">${esc(name.slice(0,10))}</span>`;
}

function toggleCatPicker() {
  document.getElementById('cat-picker').classList.toggle('open');
}

function selectCategory(id, color, name) {
  selectedCatId    = id;
  selectedCatColor = color;
  selectedCatName  = name;
  const btn = document.getElementById('cat-tag-btn');
  if (id) {
    btn.textContent = name.slice(0, 12);
    btn.style.background = color;
    btn.classList.add('has-cat');
  } else {
    btn.textContent = '🏷 Category';
    btn.style.background = '';
    btn.classList.remove('has-cat');
  }
  // update selected state in list
  document.querySelectorAll('#cat-list .cat-option').forEach(el => {
    el.classList.toggle('selected', el.dataset.id === String(id));
  });
  document.getElementById('cat-none-opt').classList.toggle('selected', !id);
  document.getElementById('cat-picker').classList.remove('open');
}

async function loadCategoryPicker() {
  let cats;
  try { cats = await api().get_categories(); } catch(e) { return; }

  const list = document.getElementById('cat-list');
  list.innerHTML = cats.map(c =>
    `<div class="cat-option" data-id="${c.id}">
      <label class="cat-swatch-btn" title="Click to recolor" onclick="event.stopPropagation()">
        <span class="cat-swatch" style="background:${esc(c.color)}"></span>
        <input type="color" value="${esc(c.color)}" onclick="event.stopPropagation()"
               onchange="recolorCategory(${c.id}, this.value)">
      </label>
      <span class="cat-option-name" onclick="selectCategory(${c.id},'${esc(c.color)}','${esc(c.name)}')">${esc(c.name)}</span>
    </div>`
  ).join('');

  // Restore selection highlight
  if (selectedCatId) {
    const el = list.querySelector(`[data-id="${selectedCatId}"]`);
    if (el) el.classList.add('selected');
  } else {
    document.getElementById('cat-none-opt').classList.add('selected');
  }

  // Color swatches for new category
  const swatches = document.getElementById('cat-color-swatches');
  swatches.innerHTML = PRESET_COLORS.map(c =>
    `<div class="cat-color-swatch${c === newCatColor ? ' picked' : ''}"
          style="background:${c}" onclick="pickNewCatColor('${c}')"></div>`
  ).join('') +
  `<label class="cat-color-custom" title="Custom color">
    <input type="color" value="${newCatColor}" oninput="pickNewCatColor(this.value)">
   </label>`;
}

async function recolorCategory(catId, color) {
  try {
    const res = await api().update_category_color(catId, color);
    if (res.ok) {
      if (selectedCatId === catId) {
        selectedCatColor = color;
        document.getElementById('cat-tag-btn').style.background = color;
      }
      await loadAll();
    } else {
      showFeedback(res.error || 'Error', false);
    }
  } catch(e) { showFeedback('Error', false); }
}

function pickNewCatColor(color) {
  newCatColor = color;
  document.querySelectorAll('.cat-color-swatch').forEach(s => {
    s.classList.toggle('picked', s.style.background === color || s.style.backgroundColor === color);
  });
}

async function createCategory() {
  const input = document.getElementById('cat-name-input');
  const name  = input.value.trim();
  if (!name) return;
  try {
    const capturedColor = newCatColor;
    const res = await api().add_category(name, capturedColor);
    if (res.ok) {
      input.value = '';
      // Set state before reloading picker so it highlights the new item correctly
      selectedCatId    = res.id;
      selectedCatColor = capturedColor;
      selectedCatName  = name;
      await loadCategoryPicker();
      // Update button (loadCategoryPicker only updates the list, not the button)
      const btn = document.getElementById('cat-tag-btn');
      btn.textContent = name.slice(0, 12);
      btn.style.background = capturedColor;
      btn.classList.add('has-cat');
      document.getElementById('cat-picker').classList.remove('open');
    }
  } catch(e) {}
}

// Close pickers when clicking outside
document.addEventListener('click', (e) => {
  const wrap = document.getElementById('cat-picker-wrap');
  if (!wrap.contains(e.target)) {
    document.getElementById('cat-picker').classList.remove('open');
  }
  // Close task category portal
  if (_openTcp !== null && !TCP.contains(e.target)) {
    TCP.classList.remove('open');
    _openTcp = null;
  }
  // Close task priority portal
  if (_openTpp !== null && !TPP.contains(e.target)) {
    TPP.classList.remove('open');
    _openTpp = null;
  }
  // Close theme "More" submenu
  const moreMenu = document.getElementById('theme-more-menu');
  if (moreMenu && !moreMenu.contains(e.target) && e.target.id !== 'theme-more-btn') {
    moreMenu.classList.remove('open');
  }
});
document.getElementById('cat-tag-btn').addEventListener('click', (e) => {
  e.stopPropagation();
  toggleCatPicker();
});

// ── Week grid ──
function dayDotHtml(t) {
  const dotStyle = t.cat_color ? `style="background:${esc(t.cat_color)}"` : '';
  const dotClass = t.completed ? 'dot-mark done' : `dot-mark ${DOT_CLS[t.priority]||'m'}`;
  const dotFinal = t.cat_color && !t.completed
    ? `<div class="dot-mark" ${dotStyle}></div>`
    : `<div class="${dotClass}"></div>`;
  return `<div class="day-dot">
    ${dotFinal}
    <span class="dot-name ${t.completed ? 'done' : ''}">${mdFormat(t.name)}</span>
  </div>`;
}

let weekMoreHidden = []; // per-day array of the tasks not shown as dots, indexed to match week-grid children

async function loadWeekGrid() {
  let days;
  try { days = await api().get_week_overview(); }
  catch(e) { return; }
  const CAP = 4;
  weekMoreHidden = [];
  document.getElementById('week-grid').innerHTML = days.map(d => {
    // Reserve the last row for "+N more" when it's needed, so dots + label
    // never exceed CAP rows of vertical space in the fixed-height day column.
    const shown = d.tasks.length <= CAP ? d.tasks : d.tasks.slice(0, CAP - 1);
    const extra = d.tasks.length - shown.length;
    const dots = shown.map(dayDotHtml).join('');
    const dayIdx = weekMoreHidden.length;
    weekMoreHidden.push(d.tasks.slice(shown.length));
    const more = extra > 0
      ? `<div class="day-more" onmouseenter="showMoreTasks(event,${dayIdx})" onmouseleave="hideMoreTasks()">+${extra} more</div>`
      : '';
    return `<div class="day-col ${d.is_today ? 'today' : ''}">
      <div class="day-head">
        <span class="day-name">${esc(d.label)}</span>
        <span class="day-num">${d.day_num}</span>
      </div>
      <div class="day-tasks">${dots}${more}</div>
    </div>`;
  }).join('');
}

const WMP = document.getElementById('week-more-portal');

function showMoreTasks(e, dayIdx) {
  const hidden = weekMoreHidden[dayIdx] || [];
  if (!hidden.length) return;
  WMP.innerHTML = hidden.map(dayDotHtml).join('');
  const rect = e.currentTarget.getBoundingClientRect();
  WMP.style.left = Math.min(rect.left, window.innerWidth - 210) + 'px';
  WMP.style.top  = (rect.bottom + 4) + 'px';
  WMP.classList.add('open');
}

function hideMoreTasks() {
  WMP.classList.remove('open');
}

// ── Today list ──
async function loadToday() {
  let tasks;
  try { tasks = await api().get_today_tasks(); } catch(e) { return; }
  const list  = document.getElementById('today-list');
  const count = document.getElementById('today-count');
  const done  = tasks.filter(t => t.completed).length;
  count.textContent = tasks.length ? `${done}/${tasks.length}` : '';
  if (!tasks.length) {
    list.innerHTML = '<div class="empty-state">No tasks today. Type one below and press Enter.</div>';
    return;
  }
  list.innerHTML = tasks.map(t =>
    `<div class="task-row ${t.completed ? 'done-row' : ''}" data-id="${t.id}"
          ondragover="onRowDragOver(event)" ondrop="event.preventDefault()">
      <span class="drag-handle" draggable="true" ondragstart="onRowDragStart(event)" ondragend="onRowDragEnd(event)" title="Drag to reorder — overrides priority sort">&#8942;&#8942;</span>
      <div class="moved-dot ${t.reordered ? 'show' : ''}" title="${t.reordered ? 'Manually reordered' : ''}"></div>
      <div class="task-check ${t.completed ? 'checked' : ''}" onclick="toggleDone(${t.id},${t.completed})"></div>
      <span class="pri-badge ${PRI_CLASS[t.priority]}" onclick="openTaskPriPicker(event,${t.id})" title="Change priority">${PRI_LABEL[t.priority]}</span>
      <span class="task-name" data-name="${esc(t.name)}" ondblclick="startEditTask(event,${t.id})">${mdFormat(t.name)}</span>
      <div class="task-cat-wrap">
        ${t.cat_name
          ? `<span class="cat-pod" style="background:${esc(t.cat_color)}" title="Change category"
               onclick="openTaskCatPicker(event,${t.id})">${esc(t.cat_name.slice(0,10))}</span>`
          : `<button class="task-btn cat-change" onclick="openTaskCatPicker(event,${t.id})" title="Set category">&#127991;</button>`
        }
      </div>
      <button class="task-btn demote" onclick="demoteTask(${t.id})" title="Move back to weekly (removes from grid)">&#8594;w</button>
      <button class="task-btn delete" onclick="deleteTask(${t.id})" title="Remove">&#10005;</button>
    </div>`
  ).join('');
}

// ── Weekly backlog ──
async function loadWeekly() {
  let tasks;
  try { tasks = await api().get_weekly_backlog(); } catch(e) { return; }
  document.getElementById('weekly-count').textContent = tasks.length || '';
  document.getElementById('weekly-warn').style.display = tasks.length >= 10 ? 'block' : 'none';
  const list = document.getElementById('weekly-list');
  if (!tasks.length) {
    list.innerHTML = '<div class="empty-state">Backlog clear.</div>';
    return;
  }
  list.innerHTML = tasks.map(t =>
    `<div class="task-row" data-id="${t.id}"
          ondragover="onRowDragOver(event)" ondrop="event.preventDefault()">
      <span class="drag-handle" draggable="true" ondragstart="onRowDragStart(event)" ondragend="onRowDragEnd(event)" title="Drag to reorder — overrides priority sort">&#8942;&#8942;</span>
      <div class="moved-dot ${t.reordered ? 'show' : ''}" title="${t.reordered ? 'Manually reordered' : ''}"></div>
      <span class="pri-badge ${PRI_CLASS[t.priority]}" onclick="openTaskPriPicker(event,${t.id})" title="Change priority">${PRI_LABEL[t.priority]}</span>
      <span class="task-name" data-name="${esc(t.name)}" ondblclick="startEditTask(event,${t.id})">${mdFormat(t.name)}</span>
      <div class="task-cat-wrap">
        ${t.cat_name
          ? `<span class="cat-pod" style="background:${esc(t.cat_color)}" title="Change category"
               onclick="openTaskCatPicker(event,${t.id})">${esc(t.cat_name.slice(0,10))}</span>`
          : `<button class="task-btn cat-change" onclick="openTaskCatPicker(event,${t.id})" title="Set category">&#127991;</button>`
        }
      </div>
      <button class="task-btn promote" onclick="promoteTask(${t.id})" title="Move to today">&#8593; today</button>
      <button class="task-btn delete"  onclick="deleteTask(${t.id})"  title="Remove">&#10005;</button>
    </div>`
  ).join('');
}

async function loadAll() {
  await Promise.all([loadWeekGrid(), loadToday(), loadWeekly(), loadCategoryPicker()]);
}

// ── Actions ──
async function toggleDone(id, wasDone) {
  try {
    if (wasDone) await api().unmark_done(id);
    else         await api().mark_done(id);
    await Promise.all([loadToday(), loadWeekGrid()]);
  } catch(e) { showFeedback('Error', false); }
}

async function promoteTask(id) {
  try {
    await api().promote_task(id);
    await loadAll();
    showFeedback('Moved to today');
  } catch(e) { showFeedback('Error', false); }
}

// ── Priority picker — click the priority badge, pick H/M/L (same pattern as category) ──
const TPP = document.getElementById('task-pri-portal');
let _openTpp = null;
const PRI_OPTS = [[1,'High','high'], [2,'Medium','med'], [3,'Low','low']];

function openTaskPriPicker(e, taskId) {
  e.stopPropagation();
  const rect = e.currentTarget.getBoundingClientRect();
  if (_openTpp === taskId) { TPP.classList.remove('open'); _openTpp = null; return; }
  _openTpp = taskId;

  TPP.innerHTML = PRI_OPTS.map(([p, label, varName]) =>
    `<div class="task-cat-option" onclick="changeTaskPriority(${taskId},${p})">
       <div style="width:10px;height:10px;border-radius:50%;background:var(--${varName});flex-shrink:0"></div>
       <span>${label}</span>
     </div>`
  ).join('');

  TPP.style.left   = Math.max(4, rect.left) + 'px';
  TPP.style.bottom = (window.innerHeight - rect.top + 4) + 'px';
  TPP.style.top    = 'auto';
  TPP.classList.add('open');
}

async function changeTaskPriority(taskId, priority) {
  try {
    await api().set_priority(taskId, priority);
    TPP.classList.remove('open');
    _openTpp = null;
    await loadAll();
  } catch(e) { showFeedback('Error', false); }
}

// ── Row drag-to-reorder — persists a custom queue order that overrides priority sort ──
let dragRow = null;

function onRowDragStart(e) {
  dragRow = e.currentTarget.closest('.task-row');
  dragRow.classList.add('drag-ghost');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', dragRow.dataset.id);
}

function onRowDragOver(e) {
  e.preventDefault();
  if (!dragRow || e.currentTarget === dragRow) return;
  const rect   = e.currentTarget.getBoundingClientRect();
  const before = (e.clientY - rect.top) < rect.height / 2;
  const parent = e.currentTarget.parentElement;
  parent.insertBefore(dragRow, before ? e.currentTarget : e.currentTarget.nextSibling);
}

async function onRowDragEnd(e) {
  const row = e.currentTarget.closest('.task-row');
  row.classList.remove('drag-ghost');
  const container = row.parentElement;
  const scope = container.id === 'today-list' ? 'today' : 'weekly';
  const orderedIds = Array.from(container.children)
    .filter(el => el.classList.contains('task-row'))
    .map(el => parseInt(el.dataset.id, 10));
  dragRow = null;
  try {
    await api().reorder_tasks(scope, orderedIds);
    await loadAll();
  } catch(err) { showFeedback('Error', false); }
}

async function demoteTask(id) {
  try {
    await api().demote_task(id);
    await loadAll();
    showFeedback('Moved to weekly');
  } catch(e) { showFeedback('Error', false); }
}

async function deleteTask(id) {
  try { await api().delete_task(id); await loadAll(); }
  catch(e) { showFeedback('Error', false); }
}

// ── Inline task-name editing (double-click) ──
function startEditTask(e, id) {
  const span = e.currentTarget;
  if (span.querySelector('input')) return;
  const rawName = span.dataset.name;
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'task-edit-input';
  input.maxLength = 280;
  input.value = rawName;
  span.textContent = '';
  span.appendChild(input);
  input.focus();
  input.select();

  let settled = false;
  async function commit() {
    if (settled) return;
    settled = true;
    const val = input.value.trim();
    if (val && val !== rawName) {
      try {
        const res = await api().update_task_name(id, val);
        if (!res.ok) showFeedback(res.error || 'Error', false);
      } catch(err) { showFeedback('Error', false); }
    }
    await loadAll();
  }
  input.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter') { ev.preventDefault(); commit(); }
    else if (ev.key === 'Escape') { settled = true; loadAll(); }
  });
  input.addEventListener('blur', commit);
}

const TCP = document.getElementById('task-cat-portal');
let _openTcp = null;

async function openTaskCatPicker(e, taskId) {
  e.stopPropagation();
  // Capture rect synchronously — currentTarget goes null after the first await
  const rect = e.currentTarget.getBoundingClientRect();

  if (_openTcp === taskId) { TCP.classList.remove('open'); _openTcp = null; return; }
  _openTcp = taskId;

  let cats;
  try { cats = await api().get_categories(); } catch(err) { return; }

  TCP.innerHTML =
    `<div class="task-cat-option" onclick="changeTaskCat(${taskId}, null)">
       <div style="width:10px;height:10px;border-radius:50%;background:var(--border);flex-shrink:0"></div>
       <span>None</span>
     </div>` +
    cats.map(c =>
      `<div class="task-cat-option" onclick="changeTaskCat(${taskId}, ${c.id})">
         <div style="width:10px;height:10px;border-radius:50%;background:${esc(c.color)};flex-shrink:0"></div>
         <span>${esc(c.name)}</span>
       </div>`
    ).join('');

  TCP.style.left   = Math.max(4, rect.left) + 'px';
  TCP.style.bottom = (window.innerHeight - rect.top + 4) + 'px';
  TCP.style.top    = 'auto';
  TCP.classList.add('open');
}

async function changeTaskCat(taskId, catId) {
  try {
    await api().set_task_category(taskId, catId);
    TCP.classList.remove('open');
    _openTcp = null;
    await loadAll();
  } catch(e) { showFeedback('Error', false); }
}

// ── Input parsing (prefix optional, defaults to today) ──
function parseInput(raw) {
  const s = raw.trim();
  if (!s) return null;

  let scope = 'today', rest = s;
  const first = s[0].toLowerCase();
  if ((first === 'w') && s.length > 1 && (s[1] === ' ' || s[1] === '\t')) {
    scope = 'weekly';
    rest = s.slice(1).trim();
  } else if (first === 't' && s.length > 1 && (s[1] === ' ' || s[1] === '\t')) {
    rest = s.slice(1).trim(); // explicit today prefix, strip it
  }

  if (!rest) return null;

  let name = rest, priority = 2;
  const lastComma = rest.lastIndexOf(',');
  if (lastComma !== -1) {
    const p = rest.slice(lastComma + 1).trim().toLowerCase();
    if (['h','high','1'].includes(p))           { priority = 1; name = rest.slice(0, lastComma).trim(); }
    else if (['l','low','3'].includes(p))        { priority = 3; name = rest.slice(0, lastComma).trim(); }
    else if (['m','med','medium','2'].includes(p)){ priority = 2; name = rest.slice(0, lastComma).trim(); }
  }
  return name ? { name, priority, scope } : null;
}

// Update scope badge as user types
document.getElementById('task-input').addEventListener('input', (e) => {
  const s = e.target.value;
  const badge = document.getElementById('scope-badge');
  const first = s[0] ? s[0].toLowerCase() : '';
  if (first === 'w' && s.length > 1 && (s[1] === ' ' || s[1] === '\t')) {
    badge.textContent = 'WEEKLY';
    badge.className = 'scope-badge weekly-mode';
  } else {
    badge.textContent = 'TODAY';
    badge.className = 'scope-badge today-mode';
  }
});

async function submitInput() {
  const input  = document.getElementById('task-input');
  const parsed = parseInput(input.value);
  if (!parsed) {
    showFeedback('Type a task name', false);
    return;
  }
  try {
    const res = await api().add_task(parsed.name, parsed.priority, parsed.scope, selectedCatId);
    if (res.ok) {
      document.getElementById('task-input').value = '';
      document.getElementById('scope-badge').textContent = 'TODAY';
      document.getElementById('scope-badge').className = 'scope-badge today-mode';
      showFeedback(`Added to ${parsed.scope === 'today' ? 'today' : 'weekly'}`);
      await loadAll();
    } else {
      showFeedback(res.error || 'Error', false);
    }
  } catch(err) {
    showFeedback('Not ready — try again', false);
  }
}

document.getElementById('task-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') submitInput();
});
document.getElementById('send-btn').addEventListener('click', submitInput);

// ── Window navigation ──
document.getElementById('btn-pin').addEventListener('click', async () => {
  try { await api().open_window('pin'); } catch(e) {}
});
document.getElementById('btn-evening').addEventListener('click', async () => {
  try { await api().open_window('evening'); } catch(e) {}
});

// ── Settings ──
document.getElementById('btn-settings').addEventListener('click', () => {
  document.getElementById('settings-panel').classList.toggle('open');
});

document.getElementById('settings-save').addEventListener('click', async () => {
  const mt = document.getElementById('morning-time').value.trim();
  const et = document.getElementById('evening-time').value.trim();
  document.getElementById('settings-ok').textContent  = '';
  document.getElementById('settings-err').textContent = '';
  try {
    const res = await api().save_config(mt, et);
    if (res.ok) {
      document.getElementById('settings-ok').textContent = 'Saved and applied.';
      setTimeout(() => { document.getElementById('settings-ok').textContent = ''; }, 3000);
    } else {
      document.getElementById('settings-err').textContent = res.error || 'Invalid format (HH:MM).';
    }
  } catch(e) { document.getElementById('settings-err').textContent = 'Error saving.'; }
});

// ── Init ──
async function init() {
  startClock();
  setDate();
  try {
    const cfg = await api().get_config();
    renderThemeMenu(cfg);
    document.getElementById('morning-time').value = cfg.morning_time || '';
    document.getElementById('evening-time').value = cfg.evening_time || '';
  } catch(e) {}
  await loadAll();
}

// Guard for pywebviewready — event may fire before or after this script runs
if (window.pywebview && window.pywebview.api) {
  init();
} else {
  window.addEventListener('pywebviewready', init);
}
</script>
</body>
