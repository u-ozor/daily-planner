<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>Evening Review</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #2a2a2e;
    --surface:   #36363c;
    --border:    #4a4a52;
    --accent:    #6aaef0;
    --text:      #eaeaee;
    --muted:     #909098;
    --high:      #f07878;
    --med:       #e8bc50;
    --low:       #74cc7c;
    --done-text: #707078;
    --warn:      #f07878;
    --today-col: #263244;
    --today-bdr: #6aaef0;
    --input-bg:  #202024;
    --btn-hover: #404048;
  }
  html[data-theme="warm"] {
    --bg:        #fdf5e6;
    --surface:   #f5e8cf;
    --border:    #ddd0b8;
    --accent:    #7a5c38;
    --text:      #2a1e0e;
    --muted:     #9a8060;
    --high:      #cc3030;
    --med:       #b07820;
    --low:       #4a7a40;
    --done-text: #b0a090;
    --warn:      #cc3030;
    --today-col: #ffefd6;
    --today-bdr: #c89050;
    --input-bg:  #fffaf2;
    --btn-hover: #ecddc4;
  }
  html[data-theme="red"] {
    --bg:        #fff0f0;
    --surface:   #fcd8d8;
    --border:    #e8b0b0;
    --accent:    #c02020;
    --text:      #280808;
    --muted:     #a06060;
    --high:      #d01010;
    --med:       #c06820;
    --low:       #406830;
    --done-text: #c09090;
    --warn:      #d01010;
    --today-col: #ffc8c8;
    --today-bdr: #c02020;
    --input-bg:  #fff5f5;
    --btn-hover: #f4c8c8;
  }

  body {
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    font-size: 13px; height: 100vh;
    display: flex; flex-direction: column; overflow: hidden;
  }

  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 16px; border-bottom: 1px solid var(--border);
    background: var(--surface); flex-shrink: 0;
  }
  .header-label { font-size: 10px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
  .header-date  { font-size: 13px; color: var(--text); font-weight: 500; margin-top: 1px; }
  .clock { font-family: "SF Mono","Menlo",monospace; font-size: 16px; color: var(--accent); letter-spacing: 0.05em; }

  /* ── Stats ── */
  .stats-bar {
    flex-shrink: 0; padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  }
  .stat-block { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 40px; }
  .stat-value {
    font-size: 28px; font-weight: 700;
    font-family: "SF Mono","Menlo",monospace; line-height: 1;
  }
  .stat-label { font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }

  .progress-wrap { flex: 1; min-width: 100px; display: flex; flex-direction: column; gap: 4px; }
  .progress-track { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .progress-fill  { height: 100%; background: var(--low); border-radius: 3px; transition: width 0.6s ease; }
  .progress-label { font-size: 10px; color: var(--muted); display: flex; justify-content: space-between; }

  .dopamine-msg {
    font-size: 12.5px; font-weight: 600; color: var(--low);
    padding: 6px 12px; border-radius: 5px;
    background: rgba(58,112,64,0.1); border: 1px solid rgba(58,112,64,0.25);
  }
  .dopamine-msg.partial { color: var(--med); background: rgba(154,110,16,0.1); border-color: rgba(154,110,16,0.25); }
  .dopamine-msg.none    { color: var(--muted); background: transparent; border-color: var(--border); }

  /* ── Main ── */
  .main { display: flex; flex: 1; overflow: hidden; }
  .panel { display: flex; flex-direction: column; overflow: hidden; }
  .panel-today  { flex: 1.1; border-right: 1px solid var(--border); }
  .panel-weekly { flex: 0.9; }

  .panel-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 14px 5px; border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .panel-title { font-size: 10px; letter-spacing: 0.1em; color: var(--muted); text-transform: uppercase; }
  .panel-count { font-size: 10px; color: var(--muted); }
  .panel-body  { flex: 1; overflow-y: auto; padding: 5px 7px; }
  .panel-body::-webkit-scrollbar { width: 3px; }
  .panel-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .task-row {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 5px; border-radius: 4px; margin-bottom: 2px; user-select: none;
  }
  .task-row:hover { background: var(--btn-hover); }
  .task-row.done-row { opacity: 0.5; }

  .task-check {
    width: 15px; height: 15px; border: 1.5px solid var(--border); border-radius: 3px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; cursor: pointer; transition: background 0.12s, border-color 0.12s;
  }
  .task-check:hover   { border-color: var(--low); }
  .task-check.checked { background: var(--low); border-color: var(--low); }
  .task-check.checked::after { content: "✓"; font-size: 9px; color: #fff; font-weight: 700; }

  .pri-badge {
    font-size: 9px; font-weight: 700;
    padding: 1px 4px; border-radius: 3px; flex-shrink: 0; letter-spacing: 0.04em;
  }
  .pri-1 { background: rgba(176,48,48,0.15);  color: var(--high); }
  .pri-2 { background: rgba(154,110,16,0.15); color: var(--med); }
  .pri-3 { background: rgba(58,112,64,0.15);  color: var(--low); }

  .task-name { flex: 1; font-size: 12.5px; line-height: 1.3; word-break: break-word; }
  .task-row.done-row .task-name { text-decoration: line-through; }
  .task-edit-input {
    width: 100%; background: var(--input-bg); border: 1px solid var(--accent);
    border-radius: 3px; color: var(--text); font: inherit; padding: 1px 5px; outline: none;
  }

  .cat-pod {
    display: inline-flex; align-items: center;
    font-size: 9.5px; font-weight: 600; padding: 1px 6px;
    border-radius: 10px; flex-shrink: 0; color: #fff;
    white-space: nowrap; max-width: 80px; overflow: hidden; text-overflow: ellipsis;
  }

  .task-btn {
    background: none; border: none; cursor: pointer;
    color: var(--muted); font-size: 11px; padding: 2px 5px;
    border-radius: 3px; flex-shrink: 0; opacity: 0.4; transition: opacity 0.1s, color 0.1s;
  }
  .task-btn:hover { opacity: 1; }
  .task-btn.promote:hover { color: var(--accent); }

  .empty-state { color: var(--muted); font-size: 11.5px; padding: 18px 8px; text-align: center; }

  .weekly-warn {
    margin: 4px 8px 2px; padding: 5px 8px;
    background: rgba(192,48,48,0.1); border: 1px solid rgba(192,48,48,0.3);
    border-radius: 4px; color: var(--warn); font-size: 11px;
    font-weight: 600; text-align: center; display: none;
  }

  /* ── Week progress ── */
  .week-progress {
    flex-shrink: 0; padding: 7px 16px;
    border-top: 1px solid var(--border); background: var(--surface);
    display: flex; align-items: center; gap: 12px;
  }
  .week-prog-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; white-space: nowrap; }
  .week-prog-track { flex: 1; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .week-prog-fill  { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.6s ease; }
  .week-prog-count { font-size: 10px; color: var(--muted); white-space: nowrap; }

  /* ── Week completion chart ── */
  .week-chart {
    flex-shrink: 0; padding: 6px 16px 10px;
    border-top: 1px solid var(--border); background: var(--surface);
    display: flex; align-items: flex-end; gap: 8px; height: 64px;
  }
  .chart-day {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    gap: 4px; height: 100%; min-width: 0;
  }
  .chart-bar-track {
    flex: 1; width: 100%; max-width: 22px; background: var(--border);
    border-radius: 3px; display: flex; align-items: flex-end; overflow: hidden;
  }
  .chart-bar-fill { width: 100%; background: var(--accent); border-radius: 3px 3px 0 0; transition: height 0.5s ease; }
  .chart-bar-fill.today { background: var(--low); }
  .chart-day-label { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .chart-day-label.today { color: var(--accent); font-weight: 600; }

  #chart-tip-portal {
    display: none; position: fixed;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 5px; padding: 4px 8px; font-size: 10.5px;
    white-space: nowrap; box-shadow: 0 4px 16px rgba(0,0,0,0.3); z-index: 1000;
  }
  #chart-tip-portal.open { display: block; }

  /* ── Settings ── */
  .settings-panel {
    display: none; background: var(--surface);
    border-top: 1px solid var(--border); padding: 8px 14px;
    align-items: center; gap: 12px; flex-wrap: wrap; flex-shrink: 0;
  }
  .settings-panel.open { display: flex; }
  .settings-label { font-size: 11px; color: var(--muted); }
  .settings-input {
    background: var(--input-bg); border: 1px solid var(--border); border-radius: 4px;
    color: var(--text); font-family: "SF Mono","Menlo",monospace;
    font-size: 12px; padding: 3px 8px; width: 68px; outline: none;
  }
  .settings-input:focus { border-color: var(--accent); }
  .settings-save { background: var(--accent); border: none; border-radius: 4px; color: #fff; font-size: 11px; padding: 4px 12px; cursor: pointer; }
  .settings-ok  { font-size: 10px; color: var(--low); }
  .settings-err { font-size: 10px; color: var(--warn); }

  /* ── Footer ── */
  .footer {
    flex-shrink: 0; border-top: 1px solid var(--border);
    background: var(--surface); padding: 5px 12px;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .footer-cmd {
    font-family: "SF Mono","Menlo",monospace; font-size: 10px;
    color: var(--muted); background: var(--input-bg);
    border: 1px solid var(--border); border-radius: 3px; padding: 2px 7px;
  }
  .footer-btn {
    background: none; border: 1px solid var(--border);
    border-radius: 4px; color: var(--muted); font-size: 11px;
    padding: 3px 10px; cursor: pointer; transition: border-color 0.1s, color 0.1s;
  }
  .footer-btn:hover { border-color: var(--accent); color: var(--text); }

  .theme-group { display: flex; gap: 4px; margin-left: auto; }
  .theme-btn {
    background: none; border: 1px solid var(--border);
    border-radius: 4px; color: var(--muted); font-size: 10px;
    padding: 2px 8px; cursor: pointer; transition: all 0.1s;
  }
  .theme-btn:hover  { border-color: var(--accent); color: var(--text); }
  .theme-btn.active { border-color: var(--accent); color: var(--accent); font-weight: 600; }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="header-label">Evening Review</div>
    <div class="header-date" id="header-date"></div>
  </div>
  <div class="clock" id="clock"></div>
</div>

<div class="stats-bar">
  <div class="stat-block">
    <span class="stat-value" id="stat-done" style="color:var(--low)">–</span>
    <span class="stat-label">Done today</span>
  </div>
  <div class="stat-block">
    <span class="stat-value" id="stat-total" style="color:var(--muted)">–</span>
    <span class="stat-label">Total</span>
  </div>
  <div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" id="today-bar" style="width:0%"></div></div>
    <div class="progress-label"><span>Today</span><span id="today-pct">0%</span></div>
  </div>
  <div class="dopamine-msg none" id="dopamine-msg">–</div>
</div>

<div class="main">
  <div class="panel panel-today">
    <div class="panel-header">
      <span class="panel-title">Today's Tasks</span>
      <span class="panel-count" id="today-count"></span>
    </div>
    <div class="panel-body" id="today-list"></div>
  </div>
  <div class="panel panel-weekly">
    <div class="panel-header">
      <span class="panel-title">Weekly Backlog</span>
      <span class="panel-count" id="weekly-count"></span>
    </div>
    <div class="weekly-warn" id="weekly-warn">&#9888; Clean out your weeklies</div>
    <div class="panel-body" id="weekly-list"></div>
  </div>
</div>

<div class="week-progress">
  <span class="week-prog-label">This week</span>
  <div class="week-prog-track"><div class="week-prog-fill" id="week-bar" style="width:0%"></div></div>
  <span class="week-prog-count" id="week-count">–</span>
</div>

<div class="week-chart" id="week-chart"></div>
<div id="chart-tip-portal"></div>

<div class="settings-panel" id="settings-panel">
  <span class="settings-label">Morning</span>
  <input class="settings-input" id="morning-time" type="text" placeholder="07:30" maxlength="5">
  <span class="settings-label">Evening</span>
  <input class="settings-input" id="evening-time" type="text" placeholder="21:00" maxlength="5">
  <button class="settings-save" id="settings-save">Apply</button>
  <span class="settings-ok"  id="settings-ok"></span>
  <span class="settings-err" id="settings-err"></span>
</div>

<div class="footer">
  <span class="footer-cmd">planner evening</span>
  <button class="footer-btn" id="btn-settings">&#9881; Settings</button>
  <button class="footer-btn" id="btn-morning">&#9728; Morning Planner</button>
  <button class="footer-btn" id="btn-pin">&#128204; Pin Task List</button>
  <div class="theme-group">
    <button class="theme-btn" data-t="dark">Dark</button>
    <button class="theme-btn" data-t="warm">Warm</button>
    <button class="theme-btn" data-t="red">Red</button>
  </div>
</div>

<script>
function api() {
  if (!window.pywebview || !window.pywebview.api) throw new Error('not ready');
  return window.pywebview.api;
}

function startClock() {
  function tick() {
    const n = new Date(), p = v => String(v).padStart(2,'0');
    document.getElementById('clock').textContent =
      `${p(n.getHours())}:${p(n.getMinutes())}:${p(n.getSeconds())}`;
  }
  tick(); setInterval(tick, 1000);
}
function setDate() {
  document.getElementById('header-date').textContent =
    new Date().toLocaleDateString('en-US', {weekday:'long', month:'short', day:'numeric'});
}

function applyTheme(name) {
  document.documentElement.setAttribute('data-theme', name);
  document.querySelectorAll('.theme-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.t === name)
  );
}
document.querySelectorAll('.theme-btn').forEach(btn => {
  btn.addEventListener('click', async () => {
    applyTheme(btn.dataset.t);
    try { await api().save_theme(btn.dataset.t); } catch(e) {}
  });
});

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function mdFormat(s) {
  let out = esc(s);
  out = out.replace(/~~([^~]+)~~/g, '<del>$1</del>');
  out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  out = out.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  return out;
}
const PRI_LABEL = {1:'H',2:'M',3:'L'};
const PRI_CLASS = {1:'pri-1',2:'pri-2',3:'pri-3'};

function catPod(name, color) {
  if (!name) return '';
  return `<span class="cat-pod" style="background:${esc(color)}" title="${esc(name)}">${esc(name.slice(0,10))}</span>`;
}

function dopamineMsg(done, total) {
  if (total === 0) return {text:'No tasks today.', cls:'none'};
  const p = done / total;
  if (p === 1) return {text:`All ${done} done. Solid work.`, cls:''};
  if (p >= 0.7) return {text:`${done}/${total} — good day.`, cls:'partial'};
  if (p >= 0.4) return {text:`${done}/${total} — keep building.`, cls:'partial'};
  return {text:`${done}/${total} — rest and try again.`, cls:'none'};
}

async function loadStats() {
  try {
    const s = await api().get_stats();
    document.getElementById('stat-done').textContent  = s.done_today;
    document.getElementById('stat-total').textContent = s.total_today;
    const pct = s.total_today > 0 ? Math.round(s.done_today / s.total_today * 100) : 0;
    document.getElementById('today-bar').style.width = pct + '%';
    document.getElementById('today-pct').textContent  = pct + '%';
    const dm = dopamineMsg(s.done_today, s.total_today);
    const el = document.getElementById('dopamine-msg');
    el.textContent = dm.text; el.className = 'dopamine-msg ' + dm.cls;
    const wpct = s.week_total > 0 ? Math.round(s.week_done / s.week_total * 100) : 0;
    document.getElementById('week-bar').style.width = wpct + '%';
    document.getElementById('week-count').textContent = `${s.week_done}/${s.week_total} (${wpct}%)`;
  } catch(e) {}
}

async function loadToday() {
  try {
    const tasks = await api().get_today_tasks();
    const done  = tasks.filter(t => t.completed).length;
    document.getElementById('today-count').textContent = tasks.length ? `${done}/${tasks.length}` : '';
    const list = document.getElementById('today-list');
    if (!tasks.length) { list.innerHTML = '<div class="empty-state">No tasks were scheduled today.</div>'; return; }
    list.innerHTML = tasks.map(t =>
      `<div class="task-row ${t.completed ? 'done-row':''}">
        <div class="task-check ${t.completed ? 'checked':''}" onclick="toggleDone(${t.id},${t.completed})"></div>
        <span class="pri-badge ${PRI_CLASS[t.priority]}">${PRI_LABEL[t.priority]}</span>
        <span class="task-name" data-name="${esc(t.name)}" ondblclick="startEditTask(event,${t.id})">${mdFormat(t.name)}</span>
        ${t.cat_name ? catPod(t.cat_name, t.cat_color) : ''}
      </div>`
    ).join('');
  } catch(e) {}
}

async function loadWeekly() {
  try {
    const tasks = await api().get_weekly_backlog();
    document.getElementById('weekly-count').textContent = tasks.length || '';
    document.getElementById('weekly-warn').style.display = tasks.length >= 10 ? 'block' : 'none';
    const list = document.getElementById('weekly-list');
    if (!tasks.length) { list.innerHTML = '<div class="empty-state">Backlog clear.</div>'; return; }
    list.innerHTML = tasks.map(t =>
      `<div class="task-row">
        <span class="pri-badge ${PRI_CLASS[t.priority]}">${PRI_LABEL[t.priority]}</span>
        <span class="task-name" data-name="${esc(t.name)}" ondblclick="startEditTask(event,${t.id})">${mdFormat(t.name)}</span>
        ${t.cat_name ? catPod(t.cat_name, t.cat_color) : ''}
        <button class="task-btn promote" onclick="promoteTask(${t.id})" title="Move to today">&#8593; today</button>
      </div>`
    ).join('');
  } catch(e) {}
}

let weekChartData = [];

async function loadWeekChart() {
  let days;
  try { days = await api().get_week_overview(); } catch(e) { return; }
  weekChartData = days.map(d => {
    const total = d.tasks.length;
    const done  = d.tasks.filter(t => t.completed).length;
    return { label: d.label, done, total };
  });
  const chart = document.getElementById('week-chart');
  chart.innerHTML = weekChartData.map((d, i) => {
    const pct = d.total ? Math.round(d.done / d.total * 100) : 0;
    return `<div class="chart-day" onmouseenter="showChartTip(event,${i})" onmouseleave="hideChartTip()">
      <div class="chart-bar-track">
        <div class="chart-bar-fill ${days[i].is_today ? 'today' : ''}" style="height:${pct}%"></div>
      </div>
      <span class="chart-day-label ${days[i].is_today ? 'today' : ''}">${esc(d.label)}</span>
    </div>`;
  }).join('');
}

const CHART_TIP = document.getElementById('chart-tip-portal');

function showChartTip(e, i) {
  const d = weekChartData[i];
  if (!d) return;
  const pct = d.total ? Math.round(d.done / d.total * 100) : 0;
  CHART_TIP.textContent = d.total ? `${d.label}: ${d.done}/${d.total} done (${pct}%)` : `${d.label}: no tasks`;
  const rect = e.currentTarget.getBoundingClientRect();
  CHART_TIP.style.left = Math.min(rect.left, window.innerWidth - 160) + 'px';
  CHART_TIP.style.top  = (rect.top - 32) + 'px';
  CHART_TIP.classList.add('open');
}

function hideChartTip() {
  CHART_TIP.classList.remove('open');
}

async function loadAll() { await Promise.all([loadStats(), loadToday(), loadWeekly(), loadWeekChart()]); }

async function toggleDone(id, wasDone) {
  try {
    if (wasDone) await api().unmark_done(id); else await api().mark_done(id);
    await loadAll();
  } catch(e) {}
}
async function promoteTask(id) {
  try { await api().promote_task(id); await loadAll(); } catch(e) {}
}

function startEditTask(e, id) {
  const span = e.currentTarget;
  if (span.querySelector('input')) return;
  const rawName = span.dataset.name;
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'task-edit-input';
  input.maxLength = 280;
  input.value = rawName;
  span.textContent = '';
  span.appendChild(input);
  input.focus();
  input.select();

  let settled = false;
  async function commit() {
    if (settled) return;
    settled = true;
    const val = input.value.trim();
    if (val && val !== rawName) {
      try { await api().update_task_name(id, val); } catch(err) {}
    }
    await loadAll();
  }
  input.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter') { ev.preventDefault(); commit(); }
    else if (ev.key === 'Escape') { settled = true; loadAll(); }
  });
  input.addEventListener('blur', commit);
}

document.getElementById('btn-settings').addEventListener('click', () => {
  document.getElementById('settings-panel').classList.toggle('open');
});
document.getElementById('btn-morning').addEventListener('click', async () => {
  try { await api().open_window('morning'); } catch(e) {}
});
document.getElementById('btn-pin').addEventListener('click', async () => {
  try { await api().open_window('pin'); } catch(e) {}
});
document.getElementById('settings-save').addEventListener('click', async () => {
  const mt = document.getElementById('morning-time').value.trim();
  const et = document.getElementById('evening-time').value.trim();
  document.getElementById('settings-ok').textContent = '';
  document.getElementById('settings-err').textContent = '';
  try {
    const res = await api().save_config(mt, et);
    if (res.ok) {
      document.getElementById('settings-ok').textContent = 'Saved and applied.';
      setTimeout(() => { document.getElementById('settings-ok').textContent = ''; }, 3000);
    } else {
      document.getElementById('settings-err').textContent = res.error || 'Invalid format (HH:MM).';
    }
  } catch(e) { document.getElementById('settings-err').textContent = 'Error.'; }
});

async function init() {
  startClock(); setDate();
  try {
    const cfg = await api().get_config();
    applyTheme(cfg.theme || 'dark');
    document.getElementById('morning-time').value = cfg.morning_time || '';
    document.getElementById('evening-time').value = cfg.evening_time || '';
  } catch(e) {}
  await loadAll();
}

if (window.pywebview && window.pywebview.api) {
  init();
} else {
  window.addEventListener('pywebviewready', init);
}
</script>
</body>
</html>
